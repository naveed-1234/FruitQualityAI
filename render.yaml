services:
  - type: web
    name: fruitqualityai
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
